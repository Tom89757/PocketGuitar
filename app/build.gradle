plugins {
    id 'com.android.application'
}

// 应用名称 / 版本 / 编译日期：会写进 APK 文件名与 BuildConfig，便于区分发布包
def appName = "PocketGuitar"
def appVersionCode = 1
def appVersionName = "1.0.0"
def buildDate = new Date().format("yyyyMMdd")

android {
	namespace "com.example.pocketguitar"
    compileSdkVersion 34

    defaultConfig {
        applicationId 'com.example.pocketguitar'
        minSdkVersion 24
        //noinspection ExpiringTargetSdkVersion,ExpiredTargetSdkVersion
        targetSdkVersion 34
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "APP_NAME", "\"${appName}\""
        buildConfigField "String", "BUILD_DATE", "\"${buildDate}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 仓库里没有正式签名文件，先用 debug 签名保证 release APK 可直接安装；
            // 如需正式签名，替换为 signingConfigs.release 即可
            signingConfig signingConfigs.debug
        }
    }

    // 生成的 APK 文件名：应用名称-版本号-编译日期.apk
    applicationVariants.all { variant ->
        def buildType = variant.buildType.name
        variant.outputs.all { output ->
            output.outputFileName = "${appName}-v${appVersionName}-${buildDate}-${buildType}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
